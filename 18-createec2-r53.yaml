- name: Create ec2 instances for DoctorAppointment project
  hosts: local
  connection: local
  vars:
    instaces:
    - mysql
    - backend
    - frontend
    ami_id: "ami-0220d79f3f480ecf5"
    security_id: "sg-0143c6df8abb26414"
    vpc_subnet_id: "subnet-0ebfcdb20a210d658"
    instance_type: t3.small

  tasks:
  - name: install python dependencies
    ansible.builtin.pip:
      name: "{{item}}"
      executable: pip3.9
    loop:
    - boto3
    - botocore

  - name: create instances
    amazon.aws.ec2_instance:
      name: "{{item}}"
      instance_type: "{{instance_type}}"
      image_id: "{{ ami_id }}"
      vpc_subnet_id: "{{ vpc_subnet_id }}"
      security_group: "{{ security_id }}"
    loop: "{{ instaces }}"
    register: ec2_instances

  - name: print the instances
    ansible.builtin.debug:
      msg: "created instaces are {{ec2_instances}}"